%YAML:1.0

# ============================================================
# UVINS official dataset test config for UWB-Aided-VINS-Mono
# Converted bag topics:
#   /cam0/image_raw      sensor_msgs/Image
#   /imu0                sensor_msgs/Imu
#   /uwb/range           vins_estimator/UWBRange
#   /ground_truth/pose   geometry_msgs/PoseStamped
# ============================================================

#common parameters
imu_topic: "/imu0"
image_topic: "/cam0/image_raw"
output_path: "/home/pc/文档/mycode/vins_ws/src/VINS-Mono/output/uvins_dataset_test"

# UWB parameters
# Recommended unified mode:
# 0: off, original VINS-Mono
# 1: UWB correction debug, external correction idea, debug only
# 2: UWB range factor mode, reserved; factor is not connected to optimization yet
uwb_fusion_mode: 1

# Compatibility/debug switches below are kept consistent with uwb_fusion_mode=1.
# The code will still derive the effective switches from uwb_fusion_mode.
use_uwb: 1
uwb_topic: "/uwb/range"
uwb_noise: 0.1
uwb_max_interval: 0.3
use_uwb_interpolation: 1
uwb_interp_max_gap: 1.0
use_uvins_uwb_pipeline: 1
uwb_min_range: 0.2
uwb_mean_filter_window_size: 4
uwb_interp_window_size: 4
use_uwb_factor: 0
use_uwb_correction: 1
uwb_correction_debug_only: 1
uwb_correction_min_anchors: 3
uwb_correction_max_norm: 2.0
use_uwb_corrected_output: 1
uwb_corrected_output_max_norm: 2.0
use_uvins_corrected_output: 1
uvins_correction_max_norm: 2.0
uvins_correction_max_final_cost: 100.0
uvins_correction_max_delta_norm: 0.8
uvins_corrected_output_smoothing_alpha: 0.8
uvins_corrected_output_max_delta_norm: 0.10
uvins_corrected_output_max_reuse_time: 3.0
uvins_correction_max_abs_z: 0.5
uvins_corrected_output_damp_z: 0.5
uvins_uwb_residual_weight: 1.0
uvins_vio_residual_weight: 5.0
uvins_smooth_residual_weight: 20.0

# UVINS official anchors from uwb.yaml
uwb_anchor_positions:
  - [-3.507, 1.671, 1.654]
  - [2.011, -1.948, 1.672]
  - [2.228, 1.485, 1.31]

# UVINS official UWB-tag-to-IMU translation from uwb.yaml
p_uwb_imu: [0.0, -0.06, 0.1]

# Coordinate alignment flag.
# Keep 0 for now: UWB world and VINS world are not explicitly aligned yet.
uwb_world_aligned: 0
uwb_world_to_vins_yaw: 0.0
uwb_world_to_vins_translation: [0.0, 0.0, 0.0]

#camera calibration from UVINS left.yaml
model_type: PINHOLE
camera_name: camera
image_width: 640
image_height: 480
distortion_parameters:
   k1: 0.0
   k2: 0.0
   p1: 0.0
   p2: 0.0
projection_parameters:
   fx: 385.7967834472656
   fy: 385.7967834472656
   cx: 326.0679931640625
   cy: 237.22044372558594

# Extrinsic parameter between IMU and Camera.
# UVINS SKBT_280.yaml body_T_cam0, converted to imu^R_cam and imu^T_cam.
estimate_extrinsic: 1   # 0: trust the following R,T; 1: optimize around initial guess; 2: online calibrate from scratch.

# Rotation from camera frame to imu/body frame, imu^R_cam
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [-1.7165701157599411e-02, -7.9080444233025626e-03, 9.9982138481689176e-01,
          -9.9960341590191359e-01, 2.2462070310709903e-02, -1.6984296116792141e-02,
          -2.2323745675718321e-02, -9.9971641890625973e-01, -8.2904854049721255e-03]

# Translation from camera frame to imu/body frame, imu^T_cam
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [1.2023074672055490e-01, 1.5809010510553934e-02, -9.3554940386910548e-02]

#feature tracker parameters
max_cnt: 150            # max feature number in feature tracking
min_dist: 30            # min distance between two features
freq: 10                # frequency (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, frequency will be same as raw image
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
equalize: 1             # if image is too dark or light, turn on equalize to find enough features
fisheye: 0              # if using fisheye, turn on it. A circle mask will be loaded to remove edge noisy points

#optimization parameters
max_solver_time: 0.04   # max solver iteration time, to guarantee real time
max_num_iterations: 8   # max solver iterations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters from UVINS SKBT_280.yaml
acc_n: 0.1              # accelerometer measurement noise standard deviation
gyr_n: 0.01             # gyroscope measurement noise standard deviation
acc_w: 0.001            # accelerometer bias random walk noise standard deviation
gyr_w: 0.0001           # gyroscope bias random walk noise standard deviation
g_norm: 9.805           # gravity magnitude

#loop closure parameters
loop_closure: 1
load_previous_pose_graph: 0
fast_relocalization: 0
pose_graph_save_path: "/home/pc/文档/mycode/vins_ws/src/VINS-Mono/output/pose_graph/"

#unsynchronization parameters from UVINS SKBT_280.yaml
estimate_td: 1
td: -0.05

#rolling shutter parameters
rolling_shutter: 0
rolling_shutter_tr: 0

#visualization parameters
save_image: 1
visualize_imu_forward: 0
visualize_camera_size: 0.4
