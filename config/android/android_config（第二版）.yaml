%YAML:1.0

#common parameters
imu_topic: "/imu0"
image_topic: "/cam0/image_raw"
output_path: "/home/pc/文档/mycode/vins_ws/src/VINS-Mono/output/type2/"

#camera calibration
model_type: PINHOLE
camera_name: camera
image_width: 640
image_height: 480
distortion_parameters:
   k1: -0.01483193
   k2: 0.04115488
   p1: 0.0009112
   p2: -0.0002758
projection_parameters:
   fx: 405.74577391
   fy: 406.24655246
   cx: 317.9444502
   cy: 242.19246296

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 2
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 2.7921560288442637e-01, -9.53e-01,  1.17e-01,
          -9.49e-01, -2.93e-01, -1.20e-01,
           1.48e-01, -7.74e-02, -9.8590740225950491e-01 ]

extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [ -5.4880365694894823e-02, -1.30e-01, -1.2179895180651197e-02 ]

#feature tracker parameters
max_cnt: 150
min_dist: 30
freq: 0
F_threshold: 1.0
show_track: 1
equalize: 1
fisheye: 0

#optimization parameters
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

#imu parameters
acc_n: 0.0148
acc_w: 0.0020
gyr_n: 0.0021
gyr_w: 0.000017

#loop closure parameters
loop_closure: 1
load_previous_pose_graph: 0
fast_relocalization: 0
pose_graph_save_path: "/home/pc/文档/mycode/vins_ws/src/VINS-Mono/output/pose_graph/"

#unsynchronization parameters
estimate_td: 1
td: 0.0

#rolling shutter parameters
rolling_shutter: 0
rolling_shutter_tr: 0

#visualization parameters
save_image: 1
visualize_imu_forward: 0
visualize_camera_size: 0.4
